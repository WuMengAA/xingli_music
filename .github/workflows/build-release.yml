# ═══════════════════════════════════════════════════════════════════════
# 星璃音乐 · xingli_music（GitHub 开源 + OTA 更新）
# ═══════════════════════════════════════════════════════════════════════
# 自动构建 Android APK 并发布 GitHub Release（G7 开源 + OTA 基础）。
#
# 触发：
#   - push tag `cl*` / `v*`（旧方案，如 cl55、v0.26.8.14）→ 发布 Release
#   - push tag `0.26.8.*`（新渠道化方案，如 0.26.8.17_beta_cl01）→ 发布 Release
#   - 手动 workflow_dispatch → 可选 tag 构建
#
# 产物：两拆分包（arm64-v8a / armeabi-v7a）+ 各自 sha256 校验文件。
# 不产出 universal 整包（用户要求：只搞 64 / 32 位）。
# 应用内「设置 → 关于 → 版本更新」通过 GitHub API 读取 Releases：
#   按设备架构自动选对应拆分包下载；tag 比当前 (日期, cl) 更新 → 提示更新；
#   hotfix 标记（tag 含 -hotfix）→ 直接下载。
name: build-release

on:
  push:
    tags:
      - 'cl*'
      - 'v*'
      - '0.26.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 Release 需要 GITHUB_TOKEN 有 contents: write 权限；
    # 未声明时默认只读，softprops/action-gh-release 创建 Release 会 401 失败
    # （cl71–cl74 均卡在最后一步，APK 已构建成功但未被发布）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 钉死 3.44.8：本地发版环境即此版本，已验证可正常出包。
          # 旧用 channel: stable 会拉到 3.47，其要求的 Gradle/AGP/Kotlin 组合
          # 与本项目不兼容（run 33243903566 的 build 步骤 failure），导致自动发版挂掉。
          flutter-version: "3.44.8"
          cache: true

      - name: Enable Flutter
        run: flutter --version

      - name: CI-only — drop flaky Aliyun Maven mirror
        # 本地构建依赖 Aliyun 镜像（用户网络直连 Google/Maven Central 不稳），
        # 但 CI 直连 Aliyun 会偶发 502 导致构建失败（run 33955278872 / 33961879585）。
        # 这里仅修改 CI 检出副本：删 android/settings.gradle 与 android/build.gradle
        # 中含 maven.aliyun.com 的行，保留已存在的 google()/mavenCentral()/
        # gradlePluginPortal()，让 CI 直接走上游仓库。不改动仓库内已提交文件
        # （每次 checkout 都是全新副本，本地构建完全不受影响）。
        run: |
          sed -i '/maven\.aliyun\.com/d' android/settings.gradle android/build.gradle
          echo "--- settings.gradle repos ---"; grep -nE "maven|google|mavenCentral|gradlePluginPortal" android/settings.gradle || true
          echo "--- build.gradle repos ---"; grep -nE "maven|google|mavenCentral" android/build.gradle || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release, with per-ABI splits, no universal)
        # 与本地发版命令完全一致：flutter 3.44.8 + -P disable-abi-filtering=true。
        # -P disable-abi-filtering=true：绕过 Flutter 3.44.8 与 splits.abi 的冲突，
        # 改由 android/app/build.gradle 的 splits{ abi { universalApk false } }
        # 产出 arm64-v8a / armeabi-v7a 两个拆分包（不产 universal 整包）。
        # ⚠️ 已知误报（run 33250227405 实证）：splits 开启后没有统一 app-release.apk，
        # flutter 收尾会误报 "failed to produce an .apk file" 并以退出码 1 结束，
        # 但两个拆分包已真实产出。本机 build_release.sh 已按「有新鲜拆分包」而非退出码
        # 判定；CI 这里同样吸收该误报——构建后若两个拆分包存在即视为成功(exit 0)，
        # 缺失才判真失败(exit 1)，避免 set -e 在收尾误报处掐掉后续打包步骤。
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons -P disable-abi-filtering=true
          echo "flutter build exit=$?"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || true
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ] && [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            echo "split APKs produced OK — absorbing known false 'failed to produce' error"
            exit 0
          fi
          echo "split APKs MISSING — real build failure"
          exit 1

      - name: Prepare artifacts (per-ABI splits only)
        working-directory: build/app/outputs/flutter-apk
        run: |
          for f in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 星璃音乐 ${{ github.ref_name }}
          body: |
            ## 星璃音乐 ${{ github.ref_name }}
            自动构建发布（由 GitHub Actions 生成）。

            > 应用内「设置 → 关于 → 版本更新」可自动检测本 Release 并 OTA 更新：
            > 按设备架构自动选对应拆分包（arm64-v8a / armeabi-v7a）下载，无需手动选。
            > 手动下载请选对应架构的拆分包：arm64-v8a（多数现代手机）/ armeabi-v7a（旧 32 位）。
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-hotfix') }}
