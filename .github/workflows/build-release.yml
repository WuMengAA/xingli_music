# ═══════════════════════════════════════════════════════════════════════
# 星璃音乐 · xingli_music（GitHub 开源 + OTA 更新）
# ═══════════════════════════════════════════════════════════════════════
# 自动构建 Android APK 并发布 GitHub Release（G7 开源 + OTA 基础）。
#
# 触发：
#   - push tag `cl*` / `v*`（旧方案，如 cl55、v0.26.8.14）→ 发布 Release
#   - push tag `0.26.8.*`（新渠道化方案，如 0.26.8.17_beta_cl01）→ 发布 Release
#   - 手动 workflow_dispatch → 可选 tag 构建
#
# 产物：app-release.apk（Android 整包，OTA 基线）+ 两拆分包（arm64/arm32）+ sha256 校验文件。
# 应用内「设置 → 关于 → 版本更新」通过 GitHub API 读取 Releases：
#   tag 比当前 (日期, cl) 更新 → 提示更新；hotfix 标记（tag 含 -hotfix）→ 直接下载。
name: build-release

on:
  push:
    tags:
      - 'cl*'
      - 'v*'
      - '0.26.8.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 Release 需要 GITHUB_TOKEN 有 contents: write 权限；
    # 未声明时默认只读，softprops/action-gh-release 创建 Release 会 401 失败
    # （cl71–cl74 均卡在最后一步，APK 已构建成功但未被发布）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release, with per-ABI splits + universal)
        # --android-skip-build-dependency-validation：CI 的 Flutter stable(3.47)
        # 要求 Gradle ≥ 8.14，而项目 wrapper 为 8.10.2（本机旧 Flutter 可构建）。
        # 项目侧暂不升 gradle（避免影响本机），CI 用官方 bypass 开关跳过依赖校验。
        # android/app/build.gradle 已配 splits { abi { universalApk true } }，
        # 一次构建产出 arm64/armeabi 拆分包 + universal 整包（无需 --split-per-abi 标志）。
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Prepare artifacts (universal as OTA baseline + splits)
        working-directory: build/app/outputs/flutter-apk
        run: |
          # gradle universalApk 产出的整包即 app-release.apk（历史 OTA 文件名，
          # ota_service.dart 的 kOtaAssetName 直接拉它）。仅补 sha256 与拆分包校验。
          sha256sum app-release.apk > app-release.apk.sha256
          for f in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 星璃音乐 ${{ github.ref_name }}
          body: |
            ## 星璃音乐 ${{ github.ref_name }}
            自动构建发布（由 GitHub Actions 生成）。

            > 应用内「设置 → 关于 → 版本更新」可自动检测本 Release 并 OTA 更新（使用整包 app-release.apk）。
            > 手动下载建议选对应架构的拆分包（体积更小）：arm64-v8a（多数现代手机）/ armeabi-v7a（旧 32 位）。
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-hotfix') }}
