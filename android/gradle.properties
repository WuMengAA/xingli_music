org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
# 旧插件（on_audio_query_android/audioplayers_android）Java/Kotlin JVM target
# 不一致时会硬中断构建；降级为警告让构建继续（产物仍可用）
kotlin.jvm.target.validation.mode=warning
# Windows 跨盘符规避：pub 缓存（C:）与工程（D:）不在同盘，Kotlin 增量编译做
# 跨盘相对路径缓存时会抛 "different roots" 而中断构建。关掉增量编译即规避。
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# R18 构建修复：app/build.gradle 已用 Gradle 原生 `splits { abi }`（arm64-v8a +
# armeabi-v7a，universalApk=false）产出按架构拆分的 APK（见 app/build.gradle 注释）。
# 但 Flutter Gradle 插件在非 --split-per-abi 路径下会默认注入 defaultConfig.ndk.abiFilters
# （armeabi-v7a,arm64-v8a,x86_64），与上面 splits 的 include 冲突并报
# "Conflicting configuration ... ndk abiFilters cannot be present when splits abi filters are set"。
# 关掉 Flutter 的 abi 过滤注入后，完全由本项目自己的 splits 管控架构裁剪
# （仅 64/32 位，不带 x86_64、不出 universal 整包），满足 OTA 按设备架构选拆分包的诉求。
disable-abi-filtering=true
