plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace = "com.stelarith.xingli_music"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.stelarith.xingli_music"
        // 兼容取舍（用户拍板）：最低 Android 5.0（API 21）。
        // 4.4 放弃（just_audio/sensors 生态对旧版支持差，适配成本高）。
        // light 插件（minSdk 21）已移除，光线传感器用自写 MethodChannel。
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = 92
        // R18/R19：安装/应用信息显示完整展示版本串（0.26.08.15_alpha_cl76_hotfix6），
        // 而非 pubspec 截断的 "0.26.8"（flutter.versionName 只取 x.y.z）。
        // 规范（用户 2026-08-16）：0.26.08.XX_alpha_clXXX_hotfixX（月补零两位、
        // cl 过百三位、hotfix 为补丁序号）。
        // ⚠️ 每次发版与 lib/core/app_version.dart 的 AppVersion（含 hotfix 后缀）同步更新！
        versionName = "0.26.08.19_beta_cl08"
        // 架构裁剪改由 android 顶层 `splits { abi }` 统一处理（见本块下方），
        // 这里不再用 ndk.abiFilters：它与 splits / --split-per-abi 冲突，且实测
        // 管不住 Flutter 引擎 .so（多余）。x86_64 仍由文件末尾 androidComponents 排除。
    }

    buildTypes {
        release {
            // ⚠️ 高危：当前仍使用 debug 签名，仅为让 `flutter build apk --release`
            // 能直接跑通。正式对外发布前必须替换为自有 release 密钥库，
            // 否则该 APK 无法上架应用商店，且后续无法用正式密钥覆盖升级。
            signingConfig = signingConfigs.debug

            // R8 代码混淆 + 无用代码裁剪。保活规则见 proguard-rules.pro。
            // 注：本工程 dex 仅约 1MB（业务逻辑几乎都在 Dart 侧的 libapp.so），
            // 因此这一项的瘦身收益有限，主要价值是代码混淆与去除未引用类。
            minifyEnabled = true
            // 资源缩减：依赖 minifyEnabled，剔除未被引用的 res 资源。
            shrinkResources = true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    // 2026-08-17 占用优化：按 ABI 拆分 APK。用户要求「不上传、不产出整包，
    // 只搞 64 / 32 位」→ universalApk = false，仅产出两个拆分包：
    //   app-arm64-v8a-release.apk / app-armeabi-v7a-release.apk
    // OTA 端按设备架构（detectDeviceAbi）自动选对应拆分包下载，不再有 universal 整包。
    // 拆分后单架构包比原整包小约 40%（arm64 设备无需再下载 armeabi 那份引擎/业务 .so）。
    // 注意：不要再用 Flutter 的 --split-per-abi 标志——它会额外塞入 x86_64 并与
    // androidComponents 的排除规则冲突。此处由 gradle 统一管控。
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
}

// ─────────────────────────────────────────────────────────────
// 原生库（.so）按架构裁剪 —— 本工程 APK 体积的决定性因素
//
// 背景：`flutter build apk --release` 默认会为 android-arm / android-arm64 /
// android-x64 三套架构各编译一份引擎（libflutter.so）与业务代码（libapp.so），
// 且 Flutter Gradle 插件注入这些 .so 的路径绕开了 defaultConfig.ndk.abiFilters
// —— 实测上面的 abiFilters 并未拦住 x86_64，旧包里白白多带了约 20MB。
//
// 这里改用 AGP 8 的按变体打包 API 在打包阶段强制剔除 x86/x86_64。
// 只作用于 release：debug 档保持原样，x86_64 模拟器调试不受影响。
// ─────────────────────────────────────────────────────────────
androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.packaging.jniLibs.excludes.add("**/x86/**")
        variant.packaging.jniLibs.excludes.add("**/x86_64/**")
    }
}

// per-ABI 拆包已在本文件 android 顶层 `splits { abi { universalApk false } }` 配置
// （见上方），一次 `flutter build apk` 即产出：
//   app-arm64-v8a-release.apk / app-armeabi-v7a-release.apk（拆分包，更小）
// 不再产出 universal 整包（用户要求：只搞 64 / 32 位，不上传整包）。
// OTA 端按设备架构自动选对应拆分包下载。
// 不要再传 --split-per-abi 标志（会塞入 x86_64 并与 androidComponents 排除冲突）。

flutter {
    source = "../.."
}
