name: xingli_music
description: "星璃（Stelarith）· 无限音乐画布 —— 一个可以无限滑动、场景随音乐与心情变化的沉浸式个人音乐空间。"
publish_to: 'none'

version: 0.26.8+90

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # ── 状态管理 ────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── 音频引擎（音乐播放模块，随场景联动）────────────────────
  audioplayers: ^6.1.0
  just_audio: ^0.9.42
  just_audio_windows: ^0.2.3
  # media_kit（C 方案，libmpv 解码器迁移 S1）：全格式兼容 / Hi-Res / 无缝
  media_kit: ^1.2.6
  media_kit_video: ^1.2.6
  # Windows 只用 media_kit_libs_windows_video（video 版 libmpv 含 audio 解码，
  # 官方文档明确 Windows 上 audio/video libs 互斥，同时依赖会因同名 7z 校验
  # 冲突导致 CMake 构建失败——cl45 踩坑修复）。
  media_kit_libs_windows_video: ^1.0.10
  media_kit_libs_android_video: ^1.3.8

  # 后台播放 + 锁屏/通知栏控件（音频模块一）
  audio_service: ^0.18.19
  # 音频焦点管理：被打断时 duck / 暂停（音频模块一）
  # 与 just_audio 0.9.x 自带的 audio_session 0.1.x 对齐，避免版本冲突
  audio_session: ^0.1.25
  # 本地音乐真实元数据与封面读取（音频模块二）
  on_audio_query: ^2.9.0

  # ── 本地存储（音乐索引 / 使用行为 / 个人偏好）──────────────
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.4.2+1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # ── 系统权限（读取本地音乐）──────────────────────────
  permission_handler: ^11.3.1

  # ── SVG 图标渲染（game-icon-pack, CC0）───────────────
  flutter_svg: ^2.0.10

  # ── 外部流媒体：HTTP 请求 ────────────────────────────
  http: ^1.2.2

  # ── 哈希（Subsonic token 鉴权，Dart 已移除 dart:convert 的 md5）──
  crypto: ^3.0.6

  # ── OTA 增量补丁解压（cl76_hotfix6：BSDIFF40 的 bzip2 三块解压）──
  archive: ^3.6.1

  # ── v2 实验 F：传感器（仅按需 import，非 Android 平台降级兜底）──
  # 加速度/陀螺仪：摇晃切场景（Android/iOS 均支持，sensors_plus 自带）
  sensors_plus: ^7.0.0
  file_picker: ^11.0.3
  share_plus: ^12.0.2
  cross_file: ^0.3.5+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # 液态玻璃 FragmentShader（折射 + 色散）
  shaders:
    - shaders/liquid_glass.frag

  assets:
    - assets/icons/
    - assets/figma/
    # R23g：世界空间音效素材（21 个 m4a）——之前漏声明导致没打进包，
    # world_audio_engine 运行时加载失败 → 世界音效一直无声。
    - assets/audio/
    # #169：玩家方块人皮肤（MC 2× 128×128 RGBA），烘焙进体素图集供实体面采样。
    - assets/player_skin.png
